name: carrier_info
description: Carrier Info gets networkType, networkGeneration, mobileCountryCode, mobileCountryCode, e.t.c from both android and ios devices
version: 4.0.0
homepage: https://github.com/onghuisheng/carrier_info

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.chizi.carrier_info
        pluginClass: CarrierInfoPlugin
      ios:
        pluginClass: CarrierInfoPlugin
